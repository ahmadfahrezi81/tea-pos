<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="google" content="notranslate" />
<title>Tea POS Backoffice</title>
<!--
  The first thing on screen when the app is opened, and deliberately not a
  Next.js route.

  `app/layout.tsx` reads cookies, which opts the whole route tree out of static
  rendering — so nothing under it can be prerendered, and nothing that cannot be
  prerendered can be precached. A plain file in `public/` can, so the service
  worker serves this from disk with no network and no session check. It is
  reached through the worker's navigation route for `/`, not the manifest's
  `start_url`: an installed PWA reads `start_url` once, at install, so changing
  that would never reach anyone already installed.

  Background only, by design. It used to carry the logo, but leaving commits a
  navigation and the browser paints at most one frame before that — usually
  none — so the logo was fetched, decoded and discarded unseen. Holding long
  enough to see it meant paying for a second logo moment that only made the
  handover to the real loader more visible. The loader in `MobileLayoutClient`
  owns the logo now, animated and on a white background this file matches
  exactly, so the transition is nothing but a logo fading in.

  Nothing here may become personalised. It is one cached document, shared by
  every account that uses the device.
-->
<style>
    html, body {
        margin: 0;
        height: 100%;
        /* Matches the loader overlay in `MobileLayoutClient.tsx` and the
           manifest's background_color, so the OS splash, this file and the app
           are one uninterrupted colour. */
        background: #fff;
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
    }
    .offline {
        display: none;
        padding: 1rem;
    }
    .offline h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
        color: #1f2937;
    }
    .offline p {
        margin: 0 0 1.5rem;
        max-width: 20rem;
        font-size: 0.875rem;
        color: #6b7280;
    }
    .offline button {
        padding: 0.5rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: oklch(0.646 0.222 41.116);
        color: #fff;
        font-size: 0.875rem;
        font-weight: 500;
    }
    /* Revealed by script when the device reports no connection. */
    body.is-offline .offline { display: block; }
</style>
</head>
<body>
<div class="offline">
    <h1>No connection</h1>
    <p>The backoffice needs the network to start. It will continue on its own once you are back online.</p>
    <button type="button" onclick="retry()">Try again</button>
</div>

<script>
    function cookie(name) {
        var m = document.cookie.match(new RegExp("(?:^|; *)" + name + "=([^;]*)"));
        return m ? decodeURIComponent(m[1]) : "";
    }

    /* Straight to the tenant when the proxy has told us which one, skipping the
       /login round trip that exists only to have the server look it up. Both
       cookies are required: a slug outlives a session, and sending a signed-out
       person to a tenant page just earns the bounce this is here to avoid.

       Neither cookie is trusted for anything but choosing a destination. The
       proxy still authorises the navigation on arrival, so a stale or edited
       slug is corrected rather than believed. */
    function go() {
        var slug = cookie("x-tenant-slug");
        var signedIn = !!cookie("x-user-info");
        location.replace(slug && signedIn ? "/" + slug + "/mobile/home" : "/login");
    }

    /* `navigator.onLine === false` is the one direction that is reliable, and it
       is the case worth handling: leaving now would replace this screen with the
       browser's error page, which is worse than the blank it set out to fix. A
       false positive just means the navigation fails as it would have anyway. */
    function start() {
        if (navigator.onLine === false) {
            document.body.classList.add("is-offline");
            addEventListener("online", start, { once: true });
            return;
        }
        document.body.classList.remove("is-offline");
        go();
    }

    function retry() {
        if (navigator.onLine === false) return;
        go();
    }

    start();
</script>
</body>
</html>
