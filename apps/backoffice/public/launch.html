<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f1f5f9" />
<meta name="google" content="notranslate" />
<title>Tea POS Backoffice</title>
<!--
  The boot screen, and deliberately not a Next.js route.

  Reached through the service worker's navigation route for `/`, not through
  the manifest's `start_url` — an installed PWA reads `start_url` once, at
  install time, so changing it would never reach anyone already installed.

  `app/layout.tsx` reads cookies, which opts the entire route tree out of static
  rendering — so no page under it can be prerendered, and nothing that cannot be
  prerendered can be precached. A plain file in `public/` can, which means the
  service worker serves this from disk with no network and no session check, and
  the logo is on screen before anything else has started.

  Everything here is inlined for the same reason: one cached document, no second
  request to satisfy before it can paint.

  Deliberately a logo over an invisible bar.

  Leaving here commits a navigation, and the browser then suspends this document
  and holds its last painted frame until the next one is ready. Anything
  animating freezes mid-stride — a bar sat at full for the whole wait, reading as
  broken rather than as loading. So the bar is here but transparent: it holds the
  space its visible counterpart in `MobileLayoutClient.tsx` will fill, keeping
  the logo in one place across the handover, while having nothing that can
  visibly stall. The loader appears to arrive and begin, rather than to freeze
  and restart.

  Nothing here may become personalised. It is one cached file shared by every
  account that uses the device.
-->
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        height: 100%;
        background: #fff;
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { text-align: center; }
    .logo {
        width: 70px;
        height: 70px;
        margin: 0 auto 2rem;
        display: block;
        border-radius: 0.75rem;
        box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
    }
    /* Present but unseen, and that is the whole point: it reserves exactly the
       space the React loader's bar and caption will occupy. Without it this
       screen is shorter, and since both centre vertically the logo would sit
       lower here and jump upward the instant the app painted — the one thing a
       splash exists to prevent.

       Not animated. It cannot be seen, and a navigation freezes this document
       anyway, so an animation here would only cost battery. The bar in
       `MobileLayoutClient.tsx` does the moving, arriving in this exact spot. */
    .loading { opacity: 0; }
    .loading-track {
        width: 16rem;
        height: 1rem;
        background-color: #e5e7eb;
        border-radius: 9999px;
    }
    .status {
        margin-top: 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        /* Tailwind pins text-xs to a 1rem line box. Left at the browser default
           this line is ~2px taller, which shifts the logo by a pixel on the
           handover — the exact thing the spacer is here to stop. */
        line-height: 1rem;
        color: #4b5563;
    }
    .offline { display: none; }
    .offline h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
        color: #1f2937;
    }
    .offline p {
        margin: 0 0 1.5rem;
        max-width: 20rem;
        font-size: 0.875rem;
        color: #6b7280;
    }
    .offline button {
        padding: 0.5rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: oklch(0.646 0.222 41.116);
        color: #fff;
        font-size: 0.875rem;
        font-weight: 500;
    }
    /* Revealed by script when the device reports no connection. The spacer
       goes with it — nothing below needs holding a place open then. */
    body.is-offline .loading { display: none; }
    body.is-offline .offline { display: block; }

</style>
</head>

<script>
    function cookie(name) {
        var m = document.cookie.match(new RegExp("(?:^|; *)" + name + "=([^;]*)"));
        return m ? decodeURIComponent(m[1]) : "";
    }

    /* Straight to the tenant when the proxy has told us which one, skipping the
       /login round trip that exists only to have the server look it up. Both
       cookies are required: a slug outlives a session (24h against the app being
       open), and sending a signed-out person to a tenant page just means the
       proxy bounces them to /login anyway — the hop this is here to avoid.

       Neither cookie is trusted for anything but choosing a destination. The
       proxy authorises the navigation on arrival exactly as before, so a stale
       or edited slug is corrected rather than believed. */
    function go() {
        var slug = cookie("x-tenant-slug");
        var signedIn = !!cookie("x-user-info");
        location.replace(slug && signedIn ? "/" + slug + "/mobile/home" : "/login");
    }

    /* `navigator.onLine === false` is the one direction that is reliable, and it
       is the case worth handling: leaving now would replace this screen with the
       browser's error page, which is worse than the blank it set out to fix. A
       false positive just means the navigation fails as it would have anyway. */
    function start() {
        if (navigator.onLine === false) {
            document.body.classList.add("is-offline");
            addEventListener("online", start, { once: true });
            return;
        }
        document.body.classList.remove("is-offline");
        go();
    }

    /* Pressing retry while still offline would land on the browser's error
       page, which is the thing this screen exists to avoid. */
    function retry() {
        if (navigator.onLine === false) return;
        go();
    }

    start();
</script>
