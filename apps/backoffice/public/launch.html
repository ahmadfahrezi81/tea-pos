<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f1f5f9" />
<meta name="google" content="notranslate" />
<title>Tea POS Backoffice</title>
<!--
  The PWA entry point, and deliberately not a Next.js route.

  `app/layout.tsx` reads cookies, which opts the entire route tree out of static
  rendering — so no page under it can be prerendered, and nothing that cannot be
  prerendered can be precached. A plain file in `public/` can, which means the
  service worker serves this from disk with no network and no session check, and
  the logo is on screen before anything else has started.

  Everything here is inlined for the same reason: one cached document, no second
  request to satisfy before it can paint.

  The bar is a copy of `.loading-track` / `.loading-bar` in `app/globals.css`.
  They have to stay identical — the React loader in `MobileLayoutClient.tsx`
  takes over from this one mid-boot, and any difference in size or colour shows
  up as a jump at exactly the moment this is trying to look seamless.

  Nothing here may become personalised. It is one cached file shared by every
  account that uses the device.
-->
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        height: 100%;
        background: #fff;
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { text-align: center; }
    .logo {
        width: 70px;
        height: 70px;
        margin: 0 auto 2rem;
        display: block;
        border-radius: 0.75rem;
        box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
    }
    .loading-track {
        width: 16rem;
        height: 1rem;
        background-color: #e5e7eb;
        border-radius: 9999px;
        position: relative;
        overflow: hidden;
    }
    .loading-bar {
        position: absolute;
        top: 0;
        bottom: 0;
        left: -100%;
        width: 100%;
        /* `--accent-primary` in app/globals.css — kept literal here because
       this file loads no stylesheet of its own. */
        background-color: oklch(0.646 0.222 41.116);
        border-radius: 9999px;
        animation: indeterminate 1.5s ease-in-out infinite;
    }
    .gloss {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 50%;
        border-radius: 9999px;
        background: linear-gradient(to bottom, rgb(255 255 255 / 0.2), transparent);
    }
    .status {
        margin-top: 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        color: #4b5563;
        opacity: 0.9;
    }
    .offline { display: none; }
    .offline h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
        color: #1f2937;
    }
    .offline p {
        margin: 0 0 1.5rem;
        max-width: 20rem;
        font-size: 0.875rem;
        color: #6b7280;
    }
    .offline button {
        padding: 0.5rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: oklch(0.646 0.222 41.116);
        color: #fff;
        font-size: 0.875rem;
        font-weight: 500;
    }
    /* Swapped by script when the device reports no connection. */
    body.is-offline .loading { display: none; }
    body.is-offline .offline { display: block; }

    @keyframes indeterminate {
        0%   { left: -100%; width: 100%; }
        50%  { left: 0%;    width: 100%; }
        100% { left: 100%;  width: 100%; }
    }
</style>
</head>
<body>
<div class="wrap">

        <div class="loading-track"><div class="loading-bar"><div class="gloss"></div></div></div>
        <div class="status">Loading ...</div>
    </div>

    <div class="offline">
        <h1>No connection</h1>
        <p>The backoffice needs the network to start. It will continue on its own once you are back online.</p>
        <button type="button" onclick="go()">Try again</button>
    </div>
</div>

<script>
    /* Always /login. The proxy decides from there — it redirects a valid session
       on to its tenant, and renders the sign-in form for everyone else — so this
       file never has to know who is looking at it, and never has to read a
       cookie to find out. */
    function go() { location.replace("/login"); }

    /* `navigator.onLine === false` is the one direction that is reliable, and it
       is the case worth handling: leaving now would replace this screen with the
       browser's error page, which is worse than the blank it set out to fix. A
       false positive just means the navigation fails as it would have anyway. */
    if (navigator.onLine === false) {
        document.body.classList.add("is-offline");
        addEventListener("online", go, { once: true });
    } else {
        go();
    }
</script>
