<title>Tea POS</title>
<!--
  The first thing on screen when the app is opened, and deliberately not a
  Next.js route.

  `app/layout.tsx` reads cookies, which opts the whole route tree out of static
  rendering — so nothing under it can be prerendered, and nothing that cannot be
  prerendered can be precached. A plain file in `public/` can, so the service
  worker serves this from disk with no network and no session check. It is
  reached through the worker's navigation route for `/`, not the manifest's
  `start_url`: an installed PWA reads `start_url` once, at install, so changing
  that would never reach anyone already installed.

  This file owns the logo, and the loader in `MobileLayoutClient.tsx` owns the
  bar. That split is the whole design:

  Leaving here commits a navigation, and the browser then suspends this document
  and holds its last painted frame until the next one is ready. Anything
  animating freezes mid-stride, so a bar here would sit at full for the entire
  server response and read as broken rather than as loading. A still logo holds
  perfectly. So the logo is visible and the bar is present but transparent,
  reserving the exact space its counterpart will fill — the app paints the same
  logo in the same pixels and the bar simply begins to move.

  An earlier version carried no logo at all, on the grounds that it was never
  seen. That was true and the diagnosis was wrong: the script navigated away
  during parse, before this document had painted a frame, and the app's own logo
  arrived late over `/_next/image`. Both are fixed — the navigation now waits for
  a painted frame, and the app's logo is served from the precache.

  Nothing here may become personalised. It is one cached document, shared by
  every account that uses the device.
-->
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        height: 100%;
        /* Matches the loader overlay in `MobileLayoutClient.tsx` and the
           manifest's background_color, so this file and the app are one
           uninterrupted colour. */
        background: #fff;
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { text-align: center; }
    .logo {
        width: 70px;
        height: 70px;
        margin: 0 auto 2rem;
        display: block;
        border-radius: 0.75rem;
        box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
    }
    /* Present but unseen, and that is the whole point: it reserves exactly the
       space the React loader's bar and caption will occupy. Without it this
       screen is shorter, and since both centre vertically the logo would sit
       lower here and jump upward the instant the app painted — the one thing a
       splash exists to prevent.

       Not animated, deliberately. See the note above the styles. */
    .loading { opacity: 0; }
    .loading-track {
        width: 16rem;
        height: 1rem;
        background-color: #e5e7eb;
        border-radius: 9999px;
    }
    .status {
        margin-top: 1rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.75rem;
        /* Tailwind pins text-xs to a 1rem line box. Left at the browser default
           this line is ~2px taller, which shifts the logo by a pixel on the
           handover — the exact thing the spacer is here to stop. */
        line-height: 1rem;
        color: #4b5563;
    }
    .offline {
        display: none;
        padding: 1rem;
    }
    .offline h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
        color: #1f2937;
    }
    .offline p {
        margin: 0 0 1.5rem;
        max-width: 20rem;
        font-size: 0.875rem;
        color: #6b7280;
    }
    .offline button {
        padding: 0.5rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 500;
    }
    /* Revealed by script when the device reports no connection. The spacer goes
       with it — nothing below needs a place held open then. */
    body.is-offline .loading { display: none; }
    body.is-offline .offline { display: block; }
</style>
</head>

<script>
    function cookie(name) {
        var m = document.cookie.match(new RegExp("(?:^|; *)" + name + "=([^;]*)"));
        return m ? decodeURIComponent(m[1]) : "";
    }

    /* Straight to the tenant when the proxy has told us which one, skipping the
       /login round trip that exists only to have the server look it up. Both
       cookies are required: a slug outlives a session, and sending a signed-out
       person to a tenant page just earns the bounce this is here to avoid.

       Neither cookie is trusted for anything but choosing a destination. The
       proxy still authorises the navigation on arrival, so a stale or edited
       slug is corrected rather than believed. */
    function go() {
        var slug = cookie("x-tenant-slug");
        var signedIn = !!cookie("x-user-info");
        location.replace(slug && signedIn ? "/" + slug + "/mobile/home/pos" : "/login");
    }

    /* Upper bound on the wait below. Every millisecond held here is added to
       time-to-app one for one, so this is a guard against a throttled or
       backgrounded tab — where rAF may never fire — and not an expected path.
       The logo is inline and ~3KB, so the real wait is a frame or two. */
    var HOLD_MAX_MS = 150;

    /* Hold the navigation until the logo has actually been painted.

       Without this the navigation is committed during parse and the browser
       discards this document before it has drawn anything, which is why the
       logo was previously believed to be unseeable. One painted frame is all it
       takes, and it has to be a painted one: DOMContentLoaded fires before any
       paint, and `load` is both later and coarser, waiting on every subresource.

       `decode()` resolves when the bitmap can be painted without dropping a
       frame; the two nested rAFs then straddle a real paint, the first running
       before it and the second after it has been committed. */
    function whenPainted(fn) {
        var fired = false;
        function once() {
            if (fired) return;
            fired = true;
            fn();
        }
        setTimeout(once, HOLD_MAX_MS);

        var logo = document.querySelector(".logo");
        var decoded = logo && logo.decode ? logo.decode() : Promise.resolve();
        decoded.catch(function () {}).then(function () {
            requestAnimationFrame(function () {
                requestAnimationFrame(once);
            });
        });
    }

    /* `navigator.onLine === false` is the one direction that is reliable, and it
       is the case worth handling: leaving now would replace this screen with the
       browser's error page, which is worse than the blank it set out to fix. A
       false positive just means the navigation fails as it would have anyway. */
    function start() {
        if (navigator.onLine === false) {
            document.body.classList.add("is-offline");
            addEventListener("online", start, { once: true });
            return;
        }
        document.body.classList.remove("is-offline");
        whenPainted(go);
    }

    function retry() {
        if (navigator.onLine === false) return;
        go();
    }

    start();
</script>
