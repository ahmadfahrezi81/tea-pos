<title>Tea POS</title>
<!--
  The boot screen, and deliberately not a Next.js route.

  Reached through the service worker's navigation route for `/`, not through
  the manifest's `start_url` — an installed PWA reads `start_url` once, at
  install time, so changing it would never reach anyone already installed.

  `app/layout.tsx` reads cookies, which opts the entire route tree out of static
  rendering — so no page under it can be prerendered, and nothing that cannot be
  prerendered can be precached. A plain file in `public/` can, which means the
  service worker serves this from disk with no network and no session check, and
  the logo is on screen before anything else has started.

  Everything here is inlined for the same reason: one cached document, no second
  request to satisfy before it can paint.

  Deliberately the logo alone, with no progress bar.

  Leaving here commits a navigation, and the browser then suspends this document
  and holds its last painted frame until the next one is ready. Anything
  animating freezes mid-stride — a bar sat at full for the whole wait, reading as
  broken rather than as loading. There is nothing to freeze now, and the bar in
  `MobileLayoutClient.tsx` starts moving the moment the app paints, so the loader
  appears to arrive and begin rather than to stall and restart.

  Nothing here may become personalised. It is one cached file shared by every
  account that uses the device.
-->
<style>
    * { box-sizing: border-box; }
    html, body {
        margin: 0;
        height: 100%;
        background: #fff;
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { text-align: center; }
    .logo {
        width: 70px;
        height: 70px;
        margin: 0 auto 2rem;
        display: block;
        border-radius: 0.75rem;
        box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.25);
    }
    .offline { display: none; }
    .offline h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
        font-weight: 600;
        color: #1f2937;
    }
    .offline p {
        margin: 0 0 1.5rem;
        max-width: 20rem;
        font-size: 0.875rem;
        color: #6b7280;
    }
    .offline button {
        padding: 0.5rem 1rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        font-size: 0.875rem;
        font-weight: 500;
    }
    /* Revealed by script when the device reports no connection. */
    body.is-offline .offline { display: block; }

</style>

        <h1>No connection</h1>

<script>
    function cookie(name) {
        var m = document.cookie.match(new RegExp("(?:^|; *)" + name + "=([^;]*)"));
        return m ? decodeURIComponent(m[1]) : "";
    }

    /* Straight to the tenant when the proxy has told us which one, skipping the
       /login round trip that exists only to have the server look it up. Both
       cookies are required: a slug outlives a session (24h against the app being
       open), and sending a signed-out person to a tenant page just means the
       proxy bounces them to /login anyway — the hop this is here to avoid.

       Neither cookie is trusted for anything but choosing a destination. The
       proxy authorises the navigation on arrival exactly as before, so a stale
       or edited slug is corrected rather than believed. */
    function go() {
        var slug = cookie("x-tenant-slug");
        var signedIn = !!cookie("x-user-info");
        location.replace(slug && signedIn ? "/" + slug + "/mobile/home/pos" : "/login");
    }

    /* `navigator.onLine === false` is the one direction that is reliable, and it
       is the case worth handling: leaving now would replace this screen with the
       browser's error page, which is worse than the blank it set out to fix. A
       false positive just means the navigation fails as it would have anyway. */
    function start() {
        if (navigator.onLine === false) {
            document.body.classList.add("is-offline");
            addEventListener("online", start, { once: true });
            return;
        }
        document.body.classList.remove("is-offline");
        go();
    }

    /* Pressing retry while still offline would land on the browser's error
       page, which is the thing this screen exists to avoid. */
    function retry() {
        if (navigator.onLine === false) return;
        go();
    }

    start();
</script>
